<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ficha Médica</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container py-5">
    <h2 class="text-center mb-4">Formulario Ficha Médica</h2>

    <form id="fichaForm" class="card shadow p-4">
      <div class="row g-3">
        <div class="col-md-6">
          <label for="rut" class="form-label">RUT</label>
          <input type="text" class="form-control" id="rut" required>
        </div>
        <div class="col-md-6">
          <label for="nombres" class="form-label">Nombres</label>
          <input type="text" class="form-control" id="nombres" required>
        </div>
        <div class="col-md-6">
          <label for="apellidos" class="form-label">Apellidos</label>
          <input type="text" class="form-control" id="apellidos" required>
        </div>
        <div class="col-md-6">
          <label for="direccion" class="form-label">Dirección</label>
          <input type="text" class="form-control" id="direccion" required>
        </div>
        <div class="col-md-6">
          <label for="ciudad" class="form-label">Ciudad</label>
          <input type="text" class="form-control" id="ciudad" required>
        </div>
        <div class="col-md-6">
          <label for="telefono" class="form-label">Teléfono</label>
          <input type="tel" class="form-control" id="telefono" required>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email" required>
        </div>
        <div class="col-md-6">
          <label for="fechaNac" class="form-label">Fecha de Nacimiento</label>
          <input type="date" class="form-control" id="fechaNac" required>
        </div>
        <div class="col-md-6">
          <label for="estadoCivil" class="form-label">Estado Civil</label>
          <select class="form-select" id="estadoCivil" required>
            <option value="">Seleccione...</option>
            <option>Soltero</option>
            <option>Casado</option>
            <option>Divorciado</option>
            <option>Viudo</option>
          </select>
        </div>
        <div class="col-12">
          <label for="comentarios" class="form-label">Comentarios</label>
          <textarea class="form-control" id="comentarios"></textarea>
        </div>
      </div>

      <!-- Botones centrados -->
      <div class="text-center mt-4">
        <button type="button" class="btn btn-success me-2" onclick="guardar()">Guardar</button>
        <button type="reset" class="btn btn-danger me-2">Limpiar</button>
        <button type="button" class="btn btn-secondary" onclick="cerrar()">Cerrar</button>
      </div>
    </form>

    <!-- Buscar -->
    <div class="card shadow p-4 mt-4">
      <h4>Buscar por Apellido</h4>
      <div class="input-group">
        <input type="text" id="buscarApellido" class="form-control" placeholder="Ingrese apellido">
        <button class="btn btn-primary" onclick="buscar()">Buscar</button>
      </div>
      <ul id="listaResultados" class="list-group mt-3"></ul>
    </div>
  </div>

  <script>
    let registros = {};

    function guardar() {
      const rut = document.getElementById("rut").value;
      const data = {
        rut: rut,
        nombres: document.getElementById("nombres").value,
        apellidos: document.getElementById("apellidos").value,
        direccion: document.getElementById("direccion").value,
        ciudad: document.getElementById("ciudad").value,
        telefono: document.getElementById("telefono").value,
        email: document.getElementById("email").value,
        fechaNac: document.getElementById("fechaNac").value,
        estadoCivil: document.getElementById("estadoCivil").value,
        comentarios: document.getElementById("comentarios").value
      };

      if (registros[rut]) {
        if (confirm("El RUT ya existe, ¿desea sobrescribirlo?")) {
          registros[rut] = data;
          alert("Registro actualizado correctamente.");
        }
      } else {
        registros[rut] = data;
        alert("Registro guardado correctamente.");
      }
    }

    function buscar() {
      const apellido = document.getElementById("buscarApellido").value.toLowerCase();
      const lista = document.getElementById("listaResultados");
      lista.innerHTML = "";
      for (let rut in registros) {
        if (registros[rut].apellidos.toLowerCase().includes(apellido)) {
          let li = document.createElement("li");
          li.className = "list-group-item";
          li.textContent = registros[rut].nombres + " " + registros[rut].apellidos + " (" + rut + ")";
          lista.appendChild(li);
        }
      }
    }

    function cerrar() {
      if (confirm("¿Desea cerrar la aplicación?")) {
        window.close();
      }
    }
  </script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
