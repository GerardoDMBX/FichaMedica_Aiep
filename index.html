<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario Ficha Médica</title>
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .error {
      color: red;
      font-size: 0.9em;
      display: none;
    }
  </style>
</head>
<body class="bg-light">

  <div class="container mt-5">
    <h2 class="text-center mb-4">Ficha Médica</h2>
    <form id="fichaForm" class="p-4 bg-white shadow rounded">
      <div class="row g-3">
        
        <div class="col-md-6">
          <label for="rut" class="form-label">RUT *</label>
          <input type="text" class="form-control" id="rut" required>
          <div id="errorRut" class="error">El RUT solo debe contener números.</div>
        </div>

        <div class="col-md-6">
          <label for="nombres" class="form-label">Nombres *</label>
          <input type="text" class="form-control" id="nombres" required>
        </div>

        <div class="col-md-6">
          <label for="apellidos" class="form-label">Apellidos *</label>
          <input type="text" class="form-control" id="apellidos" required>
        </div>

        <div class="col-md-6">
          <label for="direccion" class="form-label">Dirección *</label>
          <input type="text" class="form-control" id="direccion" required>
        </div>

        <div class="col-md-4">
          <label for="ciudad" class="form-label">Ciudad *</label>
          <input type="text" class="form-control" id="ciudad" required>
        </div>

        <div class="col-md-4">
          <label for="pais" class="form-label">País *</label>
          <input type="text" class="form-control" id="pais" required>
        </div>

        <div class="col-md-4">
          <label for="telefono" class="form-label">Teléfono *</label>
          <input type="text" class="form-control" id="telefono" required>
          <div id="errorTelefono" class="error">El teléfono solo debe contener números.</div>
        </div>

        <div class="col-md-6">
          <label for="correo" class="form-label">Correo Electrónico *</label>
          <input type="email" class="form-control" id="correo" required>
        </div>

        <div class="col-md-6">
          <label for="fecha" class="form-label">Fecha de Nacimiento *</label>
          <input type="date" class="form-control" id="fecha" required>
        </div>

        <div class="col-md-6">
          <label for="estado" class="form-label">Estado Civil *</label>
          <select class="form-select" id="estado" required>
            <option value="">Seleccione...</option>
            <option>Soltero(a)</option>
            <option>Casado(a)</option>
            <option>Viudo(a)</option>
            <option>Divorciado(a)</option>
          </select>
        </div>

        <div class="col-md-12">
          <label for="comentarios" class="form-label">Comentarios</label>
          <textarea class="form-control" id="comentarios" rows="3"></textarea>
        </div>
      </div>

      <!-- Botones centrados -->
      <div class="text-center mt-4">
        <button type="submit" class="btn btn-success me-2">Guardar</button>
        <button type="reset" class="btn btn-warning me-2">Limpiar</button>
        <button type="button" class="btn btn-danger" onclick="window.close()">Cerrar</button>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Validaciones JS -->
  <script>
    const rutInput = document.getElementById('rut');
    const telInput = document.getElementById('telefono');
    const errorRut = document.getElementById('errorRut');
    const errorTel = document.getElementById('errorTelefono');

    // Validar que solo se ingresen números en RUT
    rutInput.addEventListener('input', function() {
      if (/[^0-9]/.test(this.value)) {
        errorRut.style.display = 'block';
      } else {
        errorRut.style.display = 'none';
      }
    });

    // Validar que solo se ingresen números en Teléfono
    telInput.addEventListener('input', function() {
      if (/[^0-9]/.test(this.value)) {
        errorTel.style.display = 'block';
      } else {
        errorTel.style.display = 'none';
      }
    });
  </script>
</body>
</html>
